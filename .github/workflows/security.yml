name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly published advisories surface without a push.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds maintainability rules on top of the
          # default security queries.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0

      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          # --redact: never print the matched secret into a public build log.
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
